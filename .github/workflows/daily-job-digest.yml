name: Daily Job Digest

on:
  schedule:
    # 13:00 UTC = 9:00 AM Eastern (EDT) / 8:00 AM Eastern (EST)
    # Change the two numbers (minute hour) to shift the run time.
    # Use https://crontab.guru to work out the UTC time for your preferred local time.
    - cron: '0 13 * * *'
  workflow_dispatch: {}   # adds a "Run workflow" button so you can test it on demand

permissions:
  contents: write   # needed so the workflow can commit tracker.json back to the repo

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run job digest script
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python job_agent_digest.py

      - name: Save tracker.json back to the repo
        run: |
          git config user.name "job-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tracker.json
          git diff --quiet --cached || git commit -m "Update job tracker [skip ci]"
          git push